general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
	screen_shader = ~/.config/hypr/shaders/color.frag

    rounding = 0
    rounding_power = 2

    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = false
        range = 5
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 2
        passes = 5

        vibrancy = 0.1696
    }
}

animations {
    enabled = no, ain't nobody got time for that :)
}

dwindle {
#    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 
    disable_hyprland_logo = true 
}
